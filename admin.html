<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BDIncome2030 - Admin Panel</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #1677ff;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .container {
      max-width: 1000px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 14px rgba(0,0,0,.08);
    }

    h2 {
      margin-top: 0;
    }

    .loading,
    .empty {
      text-align: center;
      padding: 25px;
      color: #666;
    }

    .withdrawal {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 15px;
    }

    .row {
      margin: 7px 0;
    }

    .label {
      font-weight: bold;
    }

    .amount {
      font-size: 24px;
      font-weight: bold;
      margin: 10px 0;
    }

    .status {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      background: #fff3cd;
      color: #856404;
      font-weight: bold;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 11px 18px;
      cursor: pointer;
      font-weight: bold;
    }

    .approve {
      background: #16a34a;
      color: white;
    }

    .reject {
      background: #dc2626;
      color: white;
    }

    .refresh {
      background: #1677ff;
      color: white;
    }

    .logout {
      background: #333;
      color: white;
      margin-top: 15px;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #adminPanel {
      display: none;
    }

    #message {
      margin-bottom: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>BDIncome2030 Admin Panel</h1>
</header>

<div class="container">

  <div id="message"></div>

  <div id="adminPanel">

    <div class="card">
      <h2>💰 Withdrawal Requests</h2>

      <button class="refresh" onclick="loadWithdrawals()">
        🔄 Refresh
      </button>
    </div>

    <div id="withdrawalList">
      <div class="loading">
        Withdrawal loading...
      </div>
    </div>
<!-- Task Submissions -->
<div class="card">
  <h2>📋 Task Submissions</h2>

  <button class="refresh" onclick="loadTaskSubmissions()">
    🔄 Refresh Tasks
  </button>
</div>

<div id="taskSubmissionList">
  <div class="loading">
    Task submissions loading...
  </div>
</div>
    <button class="logout" onclick="logout()">
      Logout
    </button>

  </div>

</div>

<script>
  const SUPABASE_URL =
    "https://jqpxkqitklzxhzcobisv.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_sF42Wa1UmTXPOXK9NvMVdw_eZiKyh6o";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==========================================
  // CHECK ADMIN
  // ==========================================

  async function checkAdmin() {

    const message =
      document.getElementById("message");

    try {

      const {
        data: { user },
        error
      } = await supabaseClient.auth.getUser();

      if (error || !user) {
        message.textContent =
          "প্রথমে Admin account দিয়ে Login করুন।";
        return;
      }


      const { data: admin, error: adminError } =
        await supabaseClient
          .from("admin_users")
          .select("user_id")
          .eq("user_id", user.id)
          .maybeSingle();


      if (adminError) {
        console.error(adminError);

        message.textContent =
          "Admin যাচাই করতে সমস্যা হয়েছে।";

        return;
      }


      if (!admin) {

        message.textContent =
          "❌ আপনি Admin নন।";

        return;
      }


      // Admin verified
      message.textContent =
        "✅ Admin হিসেবে Login হয়েছে।";

      document.getElementById("adminPanel")
        .style.display = "block";
await loadWithdrawals();
await loadTaskSubmissions();
} catch (error) {

      console.error(error);

      message.textContent =
        "একটি সমস্যা হয়েছে।";
    }
  }


  // ==========================================
  // LOAD WITHDRAWALS
  // ==========================================

  async function loadWithdrawals() {

    const list =
      document.getElementById("withdrawalList");

    list.innerHTML =
      '<div class="loading">Loading...</div>';


    const {
      data,
      error
    } = await supabaseClient
      .from("withdrawal_requests")
      .select(
        "id, user_id, amount, payment_method, payment_number, status, created_at"
      )
      .eq("status", "pending")
      .order("created_at", {
        ascending: false
      });


    if (error) {

      console.error(error);

      list.innerHTML =
        '<div class="empty">Withdrawal load করা যায়নি।<br>' +
        error.message +
        '</div>';

      return;
    }


    if (!data || data.length === 0) {

      list.innerHTML =
        '<div class="card empty">কোনো Pending Withdrawal নেই।</div>';

      return;
    }


    list.innerHTML = "";


    data.forEach(request => {

      const div =
        document.createElement("div");

      div.className = "card withdrawal";


      const date =
        new Date(request.created_at)
          .toLocaleString("bn-BD");


      div.innerHTML = `

        <div class="row">
          <span class="label">Request ID:</span>
          ${request.id}
        </div>

        <div class="row">
          <span class="label">User ID:</span>
          ${request.user_id}
        </div>

        <div class="amount">
          ৳ ${Number(request.amount).toFixed(2)}
        </div>

        <div class="row">
          <span class="label">Payment Method:</span>
          ${request.payment_method}
        </div>

        <div class="row">
          <span class="label">Payment Number:</span>
          ${request.payment_number}
        </div>

        <div class="row">
          <span class="label">Request Time:</span>
          ${date}
        </div>

        <div class="row">
          <span class="status">
            ${request.status}
          </span>
        </div>

        <div class="buttons">

          <button
            class="approve"
            onclick="processWithdrawal(${request.id}, 'approve', this)">
            ✅ Approve
          </button>

          <button
            class="reject"
            onclick="processWithdrawal(${request.id}, 'reject', this)">
            ❌ Reject
          </button>

        </div>
      `;


      list.appendChild(div);

    });
  }


  // ==========================================
  // APPROVE / REJECT
  // ==========================================

  async function processWithdrawal(
    requestId,
    action,
    button
  ) {

    const confirmText =
      action === "approve"
        ? "এই Withdrawal Approve করবেন?"
        : "এই Withdrawal Reject করবেন?";


    if (!confirm(confirmText)) {
      return;
    }


    const buttons =
      button.parentElement
        .querySelectorAll("button");


    buttons.forEach(btn => {
      btn.disabled = true;
    });


    button.textContent =
      "Processing...";


    try {

      const {
        data,
        error
      } = await supabaseClient
        .rpc(
          "admin_process_withdrawal",
          {
            p_request_id: requestId,
            p_action: action
          }
        );


      if (error) {

        console.error(error);

        alert(
          "সমস্যা হয়েছে:\n" +
          error.message
        );

        buttons.forEach(btn => {
          btn.disabled = false;
        });

        return;
      }


      if (data === "approved") {

        alert(
          "✅ Withdrawal সফলভাবে Approve হয়েছে।\n\n" +
          "User-এর Balance থেকে টাকা কাটা হয়েছে।"
        );

      } else if (data === "rejected") {

        alert(
          "❌ Withdrawal Reject হয়েছে।\n\n" +
          "User-এর Balance থেকে টাকা কাটা হয়নি।"
        );

      } else {

        alert(
          "Request processed: " +
          data
        );
      }


      await loadWithdrawals();


    } catch (error) {

      console.error(error);

      alert(
        "একটি সমস্যা হয়েছে:\n" +
        error.message
      );

      buttons.forEach(btn => {
        btn.disabled = false;
      });

    }
  }
  // ==========================================
  // LOAD TASK SUBMISSIONS
  // ==========================================

  async function loadTaskSubmissions() {

    const list =
      document.getElementById("taskSubmissionList");

    list.innerHTML =
      '<div class="loading">Loading task submissions...</div>';

    try {

      const {
        data,
        error
      } = await supabaseClient
        .from("task_submissions")
        .select("*")
        .order("created_at", {
          ascending: false
        });

      if (error) {

        console.error(error);

        list.innerHTML =
          '<div class="card empty">' +
          'Task submissions load করা যায়নি।<br><br>' +
          error.message +
          '</div>';

        return;
      }

      if (!data || data.length === 0) {

        list.innerHTML =
          '<div class="card empty">' +
          'কোনো Task Submission নেই।' +
          '</div>';

        return;
      }

      list.innerHTML = "";

      data.forEach(submission => {

        const div =
          document.createElement("div");

        div.className = "card withdrawal";

        const date =
          submission.created_at
            ? new Date(submission.created_at)
                .toLocaleString("bn-BD")
            : "N/A";

        div.innerHTML = `

          <div class="row">
            <span class="label">Submission ID:</span>
            ${submission.id ?? "N/A"}
          </div>

          <div class="row">
            <span class="label">User ID:</span>
            ${submission.user_id ?? "N/A"}
          </div>

          <div class="row">
            <span class="label">Task ID:</span>
            ${submission.task_id ?? "N/A"}
          </div>

          <div class="row">
            <span class="label">Status:</span>
            ${submission.status ?? "N/A"}
          </div>

          <div class="row">
            <span class="label">Proof:</span>
            ${submission.proof ?? "N/A"}
          </div>

          <div class="row">
            <span class="label">Submitted:</span>
            ${date}
          </div>

        `;

        list.appendChild(div);

      });

    } catch (error) {

      console.error(error);

      list.innerHTML =
        '<div class="card empty">' +
        'একটি সমস্যা হয়েছে।<br><br>' +
        error.message +
        '</div>';
    }
  }


  // ==========================================
  // LOGOUT
  // ==========================================

    // ==========================================
  // LOGOUT
  // ==========================================

  async function logout() {

    await supabaseClient.auth.signOut();

    document.getElementById("adminPanel")
      .style.display = "none";

    document.getElementById("message")
      .textContent = "Logout হয়েছে.";

  }


  // ==========================================
  // START
  // ==========================================

  checkAdmin();

</script>

</body>
</html>
